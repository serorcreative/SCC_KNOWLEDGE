[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scc-knowledge"
description = "Base de connaissance consolidée de Seror Créative Core (SCC)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Frédérique Seror", email = "serorfrederique@gmail.com" }]
keywords = ["knowledge", "consolidation", "taxonomy", "semantic-graph", "seror-creative", "scc"]
dynamic = ["version"]
# Aucune dépendance obligatoire : le moteur V1 repose sur la bibliothèque standard.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
scc-knowledge = "scc_knowledge.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "scc_knowledge.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
